name: PR Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'
  PNPM_VERSION: '10.13.1'

jobs:
  deploy-pr:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}
          restore-keys: |
            pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            pr-${{ github.event.number }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .pnpm-store
          key: pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: apps/frontend/dist
          key: pr-${{ github.event.number }}-build-${{ hashFiles('apps/frontend/src/**/*') }}-${{ hashFiles('apps/frontend/package.json') }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy PR environment
        run: |
          cd infra
          pnpm run deploy:sst --stage pr-${{ github.event.number }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Get PR URL
        id: get-pr-url
        run: |
          cd infra
          # Deploy and capture output
          DEPLOY_OUTPUT=$(pnpm run deploy:sst --stage pr-${{ github.event.number }} 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract URL from SST output (looks for CloudFront URLs specifically)
          URL=$(echo "$DEPLOY_OUTPUT" | grep -o 'https://[a-z0-9]*\.cloudfront\.net' | head -1 || echo "PR URL not found")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Comment PR URL
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `🚀 **PR Environment Deployed!**\n\n**Preview URL:** ${process.env.PR_URL}\n\n**Stage:** \`pr-${context.issue.number}\`\n\nThis environment will be automatically destroyed when the PR is merged or closed.`;

            // Find and update existing comment or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('PR Environment Deployed!')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
        env:
          PR_URL: ${{ steps.get-pr-url.outputs.url }}

  destroy-pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy PR environment
        run: |
          cd infra
          pnpm run remove:sst --stage pr-${{ github.event.number }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Comment destruction
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `🧹 **PR Environment Destroyed**\n\nThe temporary environment for this PR has been cleaned up.\n\n**Stage:** \`pr-${context.issue.number}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
