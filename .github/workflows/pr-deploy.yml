name: PR Deployment

on:
  workflow_run:
    workflows: ['Continuous Integration']
    types:
      - completed
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  PNPM_VERSION: '10.13.1'

jobs:
  deploy-pr:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.workflow_run.pull_requests[0].number }}

    steps:
      - name: Extract PR Number
        id: extract_pr
        run: echo "PR_NUMBER=${{ github.event.workflow_run.pull_requests[0].number }}" >> $GITHUB_OUTPUT
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ci-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}
          restore-keys: |
            ci-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ci-

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .pnpm-store
          key: ci-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend/dist
            apps/backend/dist
          key: ci-build-${{ hashFiles('apps/frontend/src/**/*') }}-${{ hashFiles('apps/backend/src/**/*') }}-${{ runner.os }}
          restore-keys: |
            ci-build-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy and capture URLs
        id: deploy
        run: |
          cd infra
          pnpm run deploy:sst --stage pr-${{ github.event.number }} --outputs-file sst-outputs.json

          BACKEND_URL=$(jq -r '.NestJSAPI.url' sst-outputs.json)
          FRONTEND_URL=$(jq -r '.FrontendSite.url' sst-outputs.json)

          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Comment PR URLs
        uses: actions/github-script@v7
        with:
          script: |
            const backendUrl = process.env.BACKEND_URL;
            const frontendUrl = process.env.FRONTEND_URL;

            let comment = `🚀 **PR Environment Deployed!**\n\n`;

            if (frontendUrl && frontendUrl !== "null") {
              comment += `**Frontend URL:** ${frontendUrl}\n`;
            }

            if (backendUrl && backendUrl !== "null") {
              comment += `**Backend API URL:** ${backendUrl}\n`;
            }

            comment += `\n**Stage:** \`pr-${context.issue.number}\`\n\nThis environment will be automatically destroyed when the PR is merged or closed.`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('PR Environment Deployed!')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
        env:
          BACKEND_URL: ${{ steps.deploy.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.deploy.outputs.frontend_url }}

  destroy-pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy PR environment
        run: |
          cd infra
          chmod +x remove-all.sh
          STAGE=pr-${{ github.event.number }} ./remove-all.sh
        continue-on-error: true

      - name: Comment destruction
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `🧹 **PR Environment Destroyed**\n\nThe temporary environment for this PR has been cleaned up.\n\n**Stage:** \`pr-${context.issue.number}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
