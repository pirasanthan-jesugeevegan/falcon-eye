name: PR Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [master]

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  PNPM_VERSION: '10.13.1'

jobs:
  deploy-pr:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}
          restore-keys: |
            pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-
            pr-${{ github.event.number }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .pnpm-store
          key: pr-${{ github.event.number }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend/dist
            apps/backend/dist
          key: pr-${{ github.event.number }}-build-${{ hashFiles('apps/frontend/src/**/*') }}-${{ hashFiles('apps/backend/src/**/*') }}-${{ hashFiles('apps/frontend/package.json') }}-${{ hashFiles('apps/backend/package.json') }}

      - name: Build full stack
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy PR environment
        run: |
          cd infra
          pnpm run deploy:sst --stage pr-${{ github.event.number }}
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Get PR URLs
        id: get-pr-urls
        run: |
          cd infra
          # Deploy and capture output
          DEPLOY_OUTPUT=$(pnpm run deploy:sst --stage pr-${{ github.event.number }} 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract backend URL from NestJSAPI resource
          BACKEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -A 1 "NestJSAPI:" | grep "https://" | head -1 || echo "Backend URL not found")
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

          # Extract frontend URL from FrontendSite resource
          FRONTEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -A 1 "FrontendSite:" | grep "https://" | head -1 || echo "Frontend URL not found")
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

          # Debug output
          echo "Extracted Backend URL: $BACKEND_URL"
          echo "Extracted Frontend URL: $FRONTEND_URL"

      - name: Comment PR URLs
        uses: actions/github-script@v7
        with:
          script: |
            const backendUrl = process.env.BACKEND_URL;
            const frontendUrl = process.env.FRONTEND_URL;

            let comment = `🚀 **PR Environment Deployed!**\n\n`;

            if (frontendUrl && frontendUrl !== "Frontend URL not found") {
              comment += `**Frontend URL:** ${frontendUrl}\n`;
            }

            if (backendUrl && backendUrl !== "Backend URL not found") {
              comment += `**Backend API URL:** ${backendUrl}\n`;
            }

            comment += `\n**Stage:** \`pr-${context.issue.number}\`\n\nThis environment will be automatically destroyed when the PR is merged or closed.`;

            // Find and update existing comment or create new one
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('PR Environment Deployed!')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
        env:
          BACKEND_URL: ${{ steps.get-pr-urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.get-pr-urls.outputs.frontend_url }}

  destroy-pr:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: pr-${{ github.event.number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SST
        run: |
          cd infra
          npm install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Destroy PR environment
        run: |
          cd infra
          chmod +x remove-all.sh
          STAGE=pr-${{ github.event.number }} ./remove-all.sh
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Comment destruction
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `🧹 **PR Environment Destroyed**\n\nThe temporary environment for this PR has been cleaned up.\n\n**Stage:** \`pr-${context.issue.number}\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });
