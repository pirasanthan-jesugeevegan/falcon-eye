name: Deploy to Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  PNPM_VERSION: '10.13.1'
  # Keep in sync with infra/sst.config.ts and infra/remove-all.sh
  SST_APP_NAME: falcon-eye

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set encryption key
        working-directory: infra
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          SST_APP_NAME: ${{ env.SST_APP_NAME }}
        run: |
          if [ -z "$ENCRYPTION_KEY" ] || [ -z "$ALLOWED_ORIGINS" ]; then
            echo "ENCRYPTION_KEY and ALLOWED_ORIGINS secrets are required."
            exit 1
          fi
          pnpm exec sst secret set EncryptionKey "$ENCRYPTION_KEY" --stage production
          pnpm exec sst secret set AllowedOrigins "$ALLOWED_ORIGINS" --stage production

      - name: Deploy
        working-directory: infra
        env:
          SST_APP_NAME: ${{ env.SST_APP_NAME }}
        run: pnpm run deploy:sst --stage production
