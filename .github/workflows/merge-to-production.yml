name: Deploy to Production (PR Merge)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number that was merged'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  AWS_REGION: eu-west-2
  NODE_VERSION: '20'
  PNPM_VERSION: '10.13.1'

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: production-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}
          restore-keys: |
            production-${{ hashFiles('**/pnpm-lock.yaml') }}-
            production-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            **/node_modules
            .pnpm-store
          key: production-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ runner.os }}

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend/dist
            apps/backend/dist
          key: production-build-${{ hashFiles('apps/frontend/src/**/*') }}-${{ hashFiles('apps/backend/src/**/*') }}-${{ hashFiles('apps/frontend/package.json') }}-${{ hashFiles('apps/backend/package.json') }}

      - name: Build full stack
        run: pnpm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy to production
        run: |
          cd infra
          pnpm run deploy:sst --stage production
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Get production URLs
        id: get-production-urls
        run: |
          cd infra
          # Deploy and capture output
          DEPLOY_OUTPUT=$(pnpm run deploy:sst --stage production 2>&1)
          echo "$DEPLOY_OUTPUT"

          # Extract backend URL from NestJSAPI resource
          BACKEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -A 1 "NestJSAPI:" | grep "https://" | head -1 || echo "Backend URL not found")
          echo "backend_url=$BACKEND_URL" >> $GITHUB_OUTPUT

          # Extract frontend URL from FrontendSite resource
          FRONTEND_URL=$(echo "$DEPLOY_OUTPUT" | grep -A 1 "FrontendSite:" | grep "https://" | head -1 || echo "Frontend URL not found")
          echo "frontend_url=$FRONTEND_URL" >> $GITHUB_OUTPUT

          # Debug output
          echo "Extracted Backend URL: $BACKEND_URL"
          echo "Extracted Frontend URL: $FRONTEND_URL"

      - name: Comment production URLs
        uses: actions/github-script@v7
        with:
          script: |
            const backendUrl = process.env.BACKEND_URL;
            const frontendUrl = process.env.FRONTEND_URL;
            const prNumber = '${{ github.event.inputs.pr_number }}';

            let comment = `🎉 **Production Deployment Complete!**\n\n**PR:** #${prNumber}\n\n`;

            if (frontendUrl && frontendUrl !== "Frontend URL not found") {
              comment += `**Production Frontend:** ${frontendUrl}\n`;
            }

            if (backendUrl && backendUrl !== "Backend URL not found") {
              comment += `**Production Backend API:** ${backendUrl}\n`;
            }

            comment += `\nDeployment successful! 🚀`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });
        env:
          BACKEND_URL: ${{ steps.get-production-urls.outputs.backend_url }}
          FRONTEND_URL: ${{ steps.get-production-urls.outputs.frontend_url }}

      - name: Notify team
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = '${{ github.event.inputs.pr_number }}';
            console.log(`Production deployment completed for PR #${prNumber}!`);
            console.log(`Frontend URL: ${process.env.FRONTEND_URL}`);
            console.log(`Backend URL: ${process.env.BACKEND_URL}`);
        env:
          FRONTEND_URL: ${{ steps.get-production-urls.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.get-production-urls.outputs.backend_url }}
